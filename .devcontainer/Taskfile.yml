version: "3"

# Devcontainer lifecycle hooks.
#
# Each task is named after the devcontainer.json lifecycle command that invokes
# it, so the mapping is literal: `"postCreateCommand": "task devcontainer:postCreate"`.
# Generic work lives in the root Taskfile as `dev:*` tasks, which are equally
# usable without a devcontainer; only container-specific steps are defined here.
#
# The root Taskfile includes this one with `dir: ./.devcontainer`, so paths below
# are relative to this directory. Root tasks reached via the `:` prefix still run
# from the repo root.
tasks:
  postCreate:
    desc: "Create-time hook: project setup plus container home-directory config"
    deps:
      - task: :dev:setup
      - task: home:setup

  postStart:
    desc: "Start-time hook: refresh submodules and background processes"
    cmds:
      - task: :dev:start

  updateContent:
    desc: "Content-update hook: rebuild the user Nix profile from flake.nix"
    # Refreshes the profile entry the Dockerfile baked from env.nix.
    # `nix profile install` conflicts with that entry, and it carries no source
    # URL for `nix profile upgrade`, so replace it. Build first so a broken
    # flake fails before the profile is removed.
    cmds:
      - nix-build env.nix --impure --no-out-link
      - nix profile remove devcontainer || true
      - nix profile install --impure --accept-flake-config --file env.nix

  clean:
    desc: "Reclaim disk space: Nix store garbage + generic project cleanup"
    # Nix-specific: the `devcontainer` profile entry and its `updateContent`
    # replacement each pin a store closure as a GC root, so switching flake
    # revisions leaves the old closure orphaned but undeleted until collected.
    # Omitting `--older-than` is `wipe-history`'s documented spelling for
    # "delete every non-current version", including the one just superseded;
    # `nix store gc` then reclaims what that frees.
    #
    # Lives here rather than in the root Taskfile because a non-container
    # checkout has no store to collect.
    deps:
      - :dev:clean
    cmds:
      - nix profile wipe-history
      - nix store gc

  home:setup:
    desc: "Apply the container's home-directory files to $HOME"
    # $HOME is container rootfs, not a mount (only /workspaces and /vscode are),
    # so it is destroyed on every rebuild. Anything that must survive a rebuild
    # belongs in .devcontainer/home/ and is re-applied here.
    #
    # --chmod is required, not cosmetic: git records only the exec bit, so a
    # fresh clone materialises 0644/0755, and a plain `rsync -a` would relax an
    # existing ~/.ssh — which may hold private keys — to world-readable. sshd
    # StrictModes rejects a group/world-writable ~/.ssh outright.
    #
    # OPTIONAL: the .ssh line matters only if you ship an authorized_keys for
    # remote access into the container. NEVER commit private keys here.
    cmds:
      - '[ -d home/.ssh ] && rsync -a --chmod=D700,F600 home/.ssh/ ~/.ssh/ || true'
      - rsync -a --exclude .ssh home/ ~/
      - direnv allow ..
