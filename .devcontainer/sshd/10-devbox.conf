# OPTIONAL — sshd hardening for this devcontainer.
#
# Only used if you uncomment the `sshd` feature in devcontainer.json AND the
# COPY line in the Dockerfile. Harmless to leave in the repo otherwise.
#
# Use it whenever this container's sshd is reachable from anywhere but
# localhost — a tunnel, a published port, a LAN address — because stock
# settings would otherwise offer a password prompt and a root login there.
#
# Why this file works, and why it is baked into the image:
#
# The `sshd:1` feature installs *after* this build and rewrites
# /etc/ssh/sshd_config with sed, but it never touches sshd_config.d. The stock
# config's `Include sshd_config.d/*.conf` sits above its own keywords, and sshd
# takes the first value it sees for a keyword, so these win.
#
# Baked in at build rather than applied by a lifecycle task so it cannot be
# skipped on a rebuild — the window where a task has not yet run is exactly the
# window where the container is already listening.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
PubkeyAuthentication yes
