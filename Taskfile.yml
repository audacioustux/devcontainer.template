version: "3"

# .env is direnv's job in an interactive shell, but lifecycle hooks run
# non-interactively: direnv exports on precmd, which `zsh -lic` never fires, so
# a postStart hook would otherwise see none of these values. Loading it here
# makes every task self-sufficient.
# A missing .env is not an error; tasks that need a value guard for it.
dotenv: [".env"]

includes:
  devcontainer:
    taskfile: ./.devcontainer/Taskfile.yml
    dir: ./.devcontainer

tasks:
  # ── Developer environment ───────────────────────────────────────────────────
  # Generic lifecycle tasks: equally usable with or without a devcontainer.
  dev:setup:
    desc: "Prepare the local development environment"
    deps:
      - task: git:setup
      - task: shell:setup
      - task: mise:setup

  dev:start:
    desc: "Bring up local sources and background processes"
    cmds:
      - task: git:submodules:update
      - task: pm2:up

  dev:clean:
    desc: "Reclaim disk space from build artifacts and stale worktrees"
    deps:
      - git:worktrees:prune
      # OPTIONAL: add language-specific cleanup, e.g. cargo:clean.

  # ── Tool versions (OPTIONAL) ────────────────────────────────────────────────
  mise:setup:
    desc: "Install mise-managed tools"
    # Both guards matter. Without mise.toml there is nothing to install;
    # without the mise binary (it is commented out in flake.nix by default)
    # the command would not exist. Either absence is the normal case, not an
    # error, so this must no-op rather than fail the whole postCreate.
    status:
      - '! test -f mise.toml || ! command -v mise'
    # `trust` first: mise refuses to read a config it has not seen before, and
    # a lifecycle hook cannot answer that prompt. Trusting the repo you just
    # checked out is the same decision you made by opening it in a devcontainer.
    # Idempotent, so it is safe on every re-run.
    cmds:
      - mise trust
      - mise install

  # ── Background processes (OPTIONAL) ─────────────────────────────────────────
  pm2:up:
    desc: "Start devcontainer background processes"
    # Guarded the same way: no ecosystem.config.js or no pm2 means nothing to
    # start. postStart runs on every resume, and `pm2 start` on an already
    # running app is a no-op, so this is safe to repeat.
    status:
      - '! test -f ecosystem.config.js || ! command -v pm2'
    cmd: pm2 start ecosystem.config.js

  pm2:down:
    desc: "Stop devcontainer background processes"
    status:
      - '! test -f ecosystem.config.js || ! command -v pm2'
    cmd: pm2 delete ecosystem.config.js
    ignore_error: true

  pm2:status:
    desc: "Show background process status and recent logs"
    status:
      - '! command -v pm2'
    cmds:
      - pm2 list
      - pm2 logs --lines 20 --nostream

  # ── Shell ───────────────────────────────────────────────────────────────────
  shell:setup:
    desc: "Trust the .envrc so direnv loads the flake environment"
    # The .zshrc itself is applied by devcontainer:home:setup from
    # .devcontainer/home/, so it survives a container rebuild.
    cmd: direnv allow .

  # ── Git ─────────────────────────────────────────────────────────────────────
  git:setup:
    desc: "Rewrite Git URLs to use the token (Codespaces only)"
    # Codespaces has no SSH agent, so ssh:// remotes cannot authenticate there.
    # `status` makes this a no-op everywhere else rather than a failure.
    status:
      - '[ "$CODESPACES" != "true" ]'
    vars:
      AuthURL: "https://x-access-token:{{.GITHUB_TOKEN}}@github.com/"
    cmds:
      - for:
          - "ssh://git@github.com/"
          - "git@github.com/"
          - "git@github.com:"
        cmd: git config --global --add url.{{.AuthURL}}.insteadOf {{.ITEM}}

  git:submodules:update:
    desc: "Update Git submodules"
    cmd: git submodule update --init --recursive

  git:worktrees:prune:
    desc: "Remove admin files for worktrees whose directory is gone"
    # Safe by construction: `git worktree prune` only clears bookkeeping for
    # worktrees already deleted from disk. It never touches an intact worktree.
    cmd: git worktree prune -v
